<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<title>مسار بلاير | Masar Player</title>
<link rel="manifest" href="./player-manifest.json">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    html, body { height: 100%; margin: 0; background: #020617; font-family: 'Cairo', sans-serif; overscroll-behavior: none; }
    * { user-select: none; -webkit-user-select: none; }
    #video-stage { position: fixed; inset: 0; background: #000; }
    #video-stage video, #video-stage iframe { width: 100%; height: 100%; border: 0; }
    #qaid-watermark {
        position: fixed; z-index: 999999; pointer-events: none; user-select: none;
        font-weight: 800; font-size: 11px; letter-spacing: .15px; color: rgba(255,255,255,.96);
        background: rgba(0,0,0,.34); border: 1px solid rgba(255,255,255,.12); border-radius: 9999px;
        padding: 3px 9px 4px; white-space: nowrap; direction: ltr;
        transition: top 8s linear, left 8s linear, opacity .2s ease;
        backdrop-filter: blur(1.5px);
    }
    .fade-in { animation: fadeIn .4s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes floatChar { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
    .float-char { animation: floatChar 3.2s ease-in-out infinite; }
</style>
</head>
<body class="text-white">

    <!-- شاشة الانتظار: بتظهر لما مفيش حصة وصلت من المنصة (مفيش توكن صالح) -->
    <div id="idle-screen" class="fixed inset-0 flex items-center justify-center p-5 bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950">
        <div class="w-full max-w-sm text-center fade-in">
            <div class="float-char mx-auto mb-6 w-40 h-40">
                <!-- شخصية كرتونية بسيطة SVG: طالب واقف مستني -->
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
                    <ellipse cx="100" cy="180" rx="55" ry="10" fill="#000" opacity="0.25"/>
                    <circle cx="100" cy="70" r="34" fill="#FBCFAA"/>
                    <path d="M66 62 Q100 30 134 62 L134 50 Q100 20 66 50 Z" fill="#312E81"/>
                    <rect x="78" y="95" width="44" height="60" rx="16" fill="#4F46E5"/>
                    <rect x="60" y="100" width="18" height="50" rx="9" fill="#4F46E5"/>
                    <rect x="122" y="100" width="18" height="50" rx="9" fill="#4F46E5"/>
                    <circle cx="60" cy="152" r="9" fill="#FBCFAA"/>
                    <circle cx="140" cy="152" r="9" fill="#FBCFAA"/>
                    <circle cx="88" cy="70" r="4" fill="#1E293B"/>
                    <circle cx="112" cy="70" r="4" fill="#1E293B"/>
                    <path d="M88 84 Q100 92 112 84" stroke="#1E293B" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <rect x="86" y="150" width="28" height="34" rx="8" fill="#1E293B"/>
                    <circle cx="140" cy="120" r="22" fill="#06B6D4" opacity="0.15"/>
                    <path d="M132 120 h16 M140 112 v16" stroke="#06B6D4" stroke-width="4" stroke-linecap="round"/>
                </svg>
            </div>
            <h1 class="text-xl font-black mb-2">في انتظار وصول ضغطك على المحاضرة</h1>
            <p class="text-sm leading-7 text-slate-400">افتح منصة مسار من المتصفح وادخل على أي حصة، وهتوصلك هنا تلقائياً وتشتغل فوراً.</p>
            <div class="mt-6 rounded-2xl border border-cyan-400/20 bg-cyan-500/5 px-4 py-3 text-xs font-bold text-cyan-300">
                النظام جاهز ويعمل في وضع الاستعداد الآمن
            </div>
            <button id="idle-install-btn" class="hidden mt-5 w-full rounded-2xl bg-brand-primary bg-indigo-600 px-5 py-3 text-sm font-black text-white hover:bg-indigo-700 transition">
                تثبيت تطبيق البلاير على شاشتك الرئيسية
            </button>
        </div>
    </div>

    <!-- شاشة الخطأ: توكن غير صالح/منتهي/رابط مرفوض -->
    <div id="error-screen" class="hidden fixed inset-0 flex items-center justify-center p-5 bg-slate-950">
        <div class="w-full max-w-sm text-center fade-in">
            <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-rose-500/15 text-rose-400 text-2xl">✕</div>
            <h1 class="text-lg font-black mb-2">تعذر فتح الحصة</h1>
            <p id="error-message" class="text-sm leading-7 text-slate-400">الرابط منتهي الصلاحية أو غير صالح. ارجع للمنصة وادخل على الحصة تاني.</p>
        </div>
    </div>

    <!-- مسرح تشغيل الفيديو -->
    <div id="video-stage" class="hidden"></div>
    <div id="qaid-watermark" class="hidden"></div>

<script>
    const LESSON_TOKEN_PREFIX = 'masar_lesson_token:';

    function showIdleScreen() {
        document.getElementById('idle-screen').classList.remove('hidden');
        document.getElementById('error-screen').classList.add('hidden');
        document.getElementById('video-stage').classList.add('hidden');
    }

    function showErrorScreen(message) {
        document.getElementById('idle-screen').classList.add('hidden');
        document.getElementById('error-screen').classList.remove('hidden');
        document.getElementById('video-stage').classList.add('hidden');
        const msgEl = document.getElementById('error-message');
        if (msgEl && message) msgEl.textContent = message;
    }

    function extractYouTubeId(url) {
        try {
            const u = new URL(url);
            if (u.hostname.includes('youtu.be')) return u.pathname.slice(1);
            if (u.searchParams.get('v')) return u.searchParams.get('v');
            const m = u.pathname.match(/\/embed\/([^/?]+)/);
            if (m) return m[1];
        } catch (e) {}
        return null;
    }

    // نفس منطق الفلترة المستخدم في المنصة - دفاع إضافي حتى لو حد لعب في localStorage يدوياً
    function isTrustedVideoUrl(rawUrl) {
        try {
            const parsed = new URL(rawUrl);
            const allowedProtocols = ['http:', 'https:'];
            const allowedHosts = ['youtube.com', 'www.youtube.com', 'youtu.be', 'm.youtube.com', 'storage.googleapis.com', 'firebasestorage.googleapis.com'];
            const host = parsed.hostname.toLowerCase();
            if (!allowedProtocols.includes(parsed.protocol)) return false;
            const isAllowedHost = allowedHosts.some(item => host === item || host.endsWith('.' + item));
            const isDirectMedia = /\.(mp4|m3u8|webm|mp3|ogg)(\?.*)?$/i.test(parsed.pathname) || host.includes('cloudfront') || host.includes('akamai') || host.includes('vimeo');
            return isAllowedHost || isDirectMedia;
        } catch (e) {
            return false;
        }
    }

    function playVideo(payload) {
        const stage = document.getElementById('video-stage');
        stage.innerHTML = '';
        stage.classList.remove('hidden');
        document.getElementById('idle-screen').classList.add('hidden');
        document.getElementById('error-screen').classList.add('hidden');

        const videoId = extractYouTubeId(payload.lessonUrl);
        if (videoId) {
            const iframe = document.createElement('iframe');
            iframe.src = `https://www.youtube.com/embed/${encodeURIComponent(videoId)}?autoplay=1&rel=0&modestbranding=1&playsinline=1`;
            iframe.allow = 'autoplay; encrypted-media; fullscreen';
            iframe.allowFullscreen = true;
            stage.appendChild(iframe);
        } else if (/\.m3u8(\?.*)?$/i.test(payload.lessonUrl) && window.Hls && Hls.isSupported()) {
            const video = document.createElement('video');
            video.controls = true;
            video.autoplay = true;
            video.playsInline = true;
            stage.appendChild(video);
            const hls = new Hls();
            hls.loadSource(payload.lessonUrl);
            hls.attachMedia(video);
        } else {
            const video = document.createElement('video');
            video.src = payload.lessonUrl;
            video.controls = true;
            video.autoplay = true;
            video.playsInline = true;
            stage.appendChild(video);
        }

        if (payload.qaidNumber && payload.qaidNumber !== 'غير متاح') {
            startQaidWatermark(payload.qaidNumber);
        }
    }

    // --- علامة رقم القيد المائية المتحركة (نفس فكرة المنصة الأصلية) ---
    let watermarkTimer = null;
    let wmState = { x: 20, y: 20, dx: 1, dy: 1 };
    function moveWatermark() {
        const el = document.getElementById('qaid-watermark');
        if (!el || el.classList.contains('hidden')) return;
        const width = el.offsetWidth || 70, height = el.offsetHeight || 22;
        const maxX = window.innerWidth - width - 20, maxY = window.innerHeight - height - 20;
        if (maxX <= 0 || maxY <= 0) return;
        if (wmState.x >= maxX || wmState.x <= 0) wmState.dx *= -1;
        if (wmState.y >= maxY || wmState.y <= 0) wmState.dy *= -1;
        wmState.x = Math.min(Math.max(wmState.x + wmState.dx * 14, 0), maxX);
        wmState.y = Math.min(Math.max(wmState.y + wmState.dy * 14, 0), maxY);
        el.style.left = wmState.x + 'px';
        el.style.top = wmState.y + 'px';
    }
    function startQaidWatermark(qaidNumber) {
        const el = document.getElementById('qaid-watermark');
        el.textContent = String(qaidNumber);
        el.classList.remove('hidden');
        el.style.left = '20px';
        el.style.top = '20px';
        if (watermarkTimer) clearInterval(watermarkTimer);
        watermarkTimer = setInterval(moveWatermark, 90);
    }

    // إجراءات رادعة بسيطة (زي المنصة الأصلية بالظبط) - مش حماية مضمونة 100% لكنها بتصعّب الأمر
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('keydown', (e) => {
        const key = (e.key || '').toLowerCase();
        if ((e.ctrlKey || e.metaKey) && ['s', 'p', 'u'].includes(key)) e.preventDefault();
        if (key === 'f12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i', 'j', 'c'].includes(key))) e.preventDefault();
    });

    /**
     * بتقرأ التوكن من الرابط، تتحقق من صلاحيته، وتمسحه فوراً من التخزين (استخدام لمرة واحدة).
     * ده بيمنع مشاركة/إعادة استخدام نفس رابط البلاير لأي حصة تانية أو من جهاز تاني.
     */
    function consumeLessonToken() {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        // ننضف الرابط من التوكن فوراً من شريط العنوان (حتى لو اتشارك سكرين شوت للرابط، التوكن مبقاش شغال أصلاً)
        if (token) {
            window.history.replaceState({}, document.title, window.location.pathname);
        }
        if (!token) {
            showIdleScreen();
            return;
        }

        const key = LESSON_TOKEN_PREFIX + token;
        let raw = null;
        try {
            raw = localStorage.getItem(key);
            localStorage.removeItem(key); // استخدام لمرة واحدة - يتمسح فور القراءة بغض النظر عن النتيجة
        } catch (e) {
            showErrorScreen('حدث خطأ أثناء قراءة بيانات الحصة.');
            return;
        }

        if (!raw) {
            showErrorScreen('الرابط ده اتستخدم قبل كدا أو غير صالح. ارجع للمنصة وادخل على الحصة تاني.');
            return;
        }

        let payload;
        try {
            payload = JSON.parse(raw);
        } catch (e) {
            showErrorScreen('بيانات الحصة تالفة. ارجع للمنصة وادخل على الحصة تاني.');
            return;
        }

        if (!payload.exp || Date.now() > Number(payload.exp)) {
            showErrorScreen('انتهت صلاحية الرابط (صالح لمدة دقيقة واحدة فقط). ارجع للمنصة وادخل على الحصة تاني.');
            return;
        }

        if (!isTrustedVideoUrl(payload.lessonUrl)) {
            showErrorScreen('رابط الحصة غير موثوق ورفضناه لأسباب أمنية.');
            return;
        }

        playVideo(payload);
    }

    // --- تثبيت التطبيق (اختياري - مش شرط للتشغيل، بس بيدي تجربة تطبيق حقيقية) ---
    let deferredInstallPrompt = null;
    function isStandalonePwa() {
        return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }
    window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        deferredInstallPrompt = event;
        const btn = document.getElementById('idle-install-btn');
        if (btn && !isStandalonePwa()) btn.classList.remove('hidden');
    });
    document.getElementById('idle-install-btn').addEventListener('click', async () => {
        if (!deferredInstallPrompt) return;
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
        document.getElementById('idle-install-btn').classList.add('hidden');
    });

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./player-sw.js').catch(() => {});
        });
    }

    consumeLessonToken();
</script>
</body>
</html>
